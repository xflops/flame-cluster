# Test-only SRE fixture. No dependency controller or issuer is installed by a Flame chart.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: flame-ci-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flame-client-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: flame-ci-root
  secretName: flame-client-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: flame-ci-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: flame-client-ca
spec:
  ca:
    secretName: flame-client-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: flame-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
