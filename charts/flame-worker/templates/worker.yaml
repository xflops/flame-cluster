apiVersion: flame.xflops.io/v1alpha1
kind: FlameWorker
metadata:
  name: {{ default .Release.Name .Values.nameOverride }}
spec:
  clusterRef: {{ .Values.clusterRef | quote }}
  address: {{ required "address must be the worker LAN IP" .Values.address | quote }}
  {{- with .Values.endpoint }}
  endpoint: {{ . | quote }}
  {{- end }}
  cachePort: {{ .Values.cachePort }}
  shims:
    {{- toYaml .Values.shims | nindent 4 }}
  maxExecutors: {{ .Values.maxExecutors }}
  pythonVersion: {{ .Values.pythonVersion | quote }}
  manageObjectCache: {{ .Values.manageObjectCache }}
  rolloutRevision: {{ .Values.rolloutRevision | quote }}
  disabled: {{ .Values.disabled }}
