fullnameOverride: ""
image:
  repository: docker.io/xflops/flame-ui
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi
replicaCount: 1
service:
  type: ClusterIP
  port: 80
  # Optional node-owned addresses, for example the manager's Tailscale IPv4.
  externalIPs: []
consoleUpstream: cluster:3000
