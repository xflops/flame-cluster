{{- if .Values.api.enabled }}
{{- $tls := deepCopy .Values.api.flame.tls -}}
{{- $joinSecret := .Values.api.join.secretName -}}
{{- $endpoint := .Values.api.flame.endpoint -}}
{{- if .Values.cluster.enabled -}}
{{- $endpoint = default (printf "https://%s-session-manager.%s.svc:8080" .Values.nameOverride .Release.Namespace) $endpoint -}}
{{- if not $tls.caConfigMap -}}
{{- $_ := set $tls "caConfigMap" .Values.gateway.issuerName -}}
{{- end -}}
{{- if not $joinSecret -}}
{{- $joinSecret = printf "%s-join" .Values.nameOverride -}}
{{- end -}}
{{- end -}}
{{- $endpoint = required "api.flame.endpoint is required when cluster.enabled=false" $endpoint -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flame-cluster.api.fullname" . }}
  labels:
    {{- include "flame-cluster.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "flame-cluster.api.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flame-cluster
          image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - {name: CONSOLE_BIND, value: "0.0.0.0:3000"}
            - name: CONSOLE_ALLOWED_HOSTS
              value: {{ join "," (required "api.security.allowedHosts must contain trusted API/UI hostnames" .Values.api.security.allowedHosts) | quote }}
            - name: FLAME_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: FLAME_NAME
              value: {{ default .Values.nameOverride .Values.api.flame.name | quote }}
            {{- if $joinSecret }}
            - {name: FLAME_JOIN_TOKEN_FILE, value: "/etc/flame/join/token"}
            - {name: FLAME_JOIN_EXPIRY_FILE, value: "/etc/flame/join/expiresAt"}
            {{- end }}
            {{- with $tls.domain }}
            - {name: FLAME_TLS_DOMAIN, value: {{ . | quote }}}
            {{- end }}
            {{- if or $tls.caConfigMap $tls.secretName }}
            {{- if or $tls.caConfigMap $tls.caKey }}
            - {name: FLAME_CA_FILE, value: "/etc/flame/tls/ca.crt"}
            {{- end }}
            {{- if and $tls.secretName (or $tls.certKey $tls.keyKey) }}
            - {name: FLAME_CERT_FILE, value: "/etc/flame/tls/tls.crt"}
            - {name: FLAME_KEY_FILE, value: "/etc/flame/tls/tls.key"}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            {{- if $joinSecret }}
            - {name: flame-join, mountPath: /etc/flame/join, readOnly: true}
            {{- end }}
            {{- if or $tls.caConfigMap $tls.secretName }}
            - {name: flame-tls, mountPath: /etc/flame/tls, readOnly: true}
            {{- end }}
      volumes:
        - name: temporary
          emptyDir: {}
        {{- if $joinSecret }}
        - name: flame-join
          secret:
            secretName: {{ $joinSecret | quote }}
            optional: true
            items:
              - {key: token, path: token}
              - {key: expiresAt, path: expiresAt}
        {{- end }}
        {{- if or $tls.caConfigMap $tls.secretName }}
        - name: flame-tls
          projected:
            sources:
              {{- if $tls.caConfigMap }}
              - configMap:
                  name: {{ $tls.caConfigMap | quote }}
                  items:
                    - {key: {{ required "flame.tls.caKey is required with caConfigMap" $tls.caKey | quote }}, path: ca.crt}
              {{- end }}
              {{- if and $tls.secretName (or (and (not $tls.caConfigMap) $tls.caKey) $tls.certKey $tls.keyKey) }}
              - secret:
                  name: {{ $tls.secretName | quote }}
                  items:
                    {{- if and (not $tls.caConfigMap) $tls.caKey }}
                    - {key: {{ $tls.caKey | quote }}, path: ca.crt}
                    {{- end }}
                    {{- if or $tls.certKey $tls.keyKey }}
                    - {key: {{ required "flame.tls.certKey is required with keyKey" $tls.certKey | quote }}, path: tls.crt}
                    - {key: {{ required "flame.tls.keyKey is required with certKey" $tls.keyKey | quote }}, path: tls.key}
                    {{- end }}
              {{- end }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
