# Both the FlameCluster resource and its API are installed by default.
cluster:
  enabled: true
nameOverride: flame
version: latest
endpoint: ""
# Installer-derived kubeconfig IPv4; combined with nodePort unless endpoint is set.
endpointHost: ""
kubernetesEndpoint: ""
rolloutRevision: ""
image: docker.io/xflops/flame-session-manager:latest
nodePort: 30080
storageSize: 20Gi
storageClass: ""
existingClaim: ""
resources:
  requests: {cpu: "1", memory: 1Gi}
  limits: {cpu: "4", memory: 8Gi}
nodeSelector: {}
cacheEndpoints: []
gateway:
  hostname: ""
  sessionPort: 30443
  cachePort: 31443
  className: flame-envoy
  envoyNamespace: envoy-gateway-system
  issuerName: flame-client-ca
  clientAuth: true

# API settings are separate from session-manager resource settings above.
api:
  enabled: true
  fullnameOverride: ""
  image:
    repository: docker.io/xflops/flame-cluster
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  replicaCount: 1
  security:
    # Add the exact UI/SSO ingress hostname; no wildcard or port entries.
    allowedHosts: [localhost, 127.0.0.1, "::1"]
  service:
    type: ClusterIP
    port: 3000
  # Operator-issued <cluster>-join Secret in this namespace. Optional for external FLM.
  # Defaults to <nameOverride>-join when cluster.enabled; otherwise no join mount.
  # The API reads its rotating token and expiresAt keys only from this mount.
  join:
    secretName: ""
  # Empty endpoint/name derive from nameOverride and the release namespace.
  # For a standalone API, set cluster.enabled=false and flame.endpoint explicitly.
  flame:
    endpoint: ""
    name: ""
    tls:
      # SRE public trust ConfigMap in this namespace, containing caKey.
      # Defaults to gateway.issuerName when cluster.enabled; otherwise unset.
      # Takes precedence over CA trust from secretName.
      caConfigMap: ""
      # Optional SRE client identity Secret; no credentials are generated here.
      # Also supports legacy CA trust when caConfigMap is empty.
      secretName: ""
      caKey: ca.crt
      certKey: ""
      keyKey: ""
      domain: ""
