apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flame-cluster.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flame-cluster.labels" . | nindent 4 }}
automountServiceAccountToken: {{ not (empty .Values.flames) }}
{{- range $flame := (include "flame-cluster.flames" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $flame.name }}-join-reader
  namespace: {{ $flame.namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ printf "%s-join" $flame.name | quote }}, {{ printf "%s-client" $flame.name | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $flame.name }}-join-reader
  namespace: {{ $flame.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flame-cluster.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $flame.name }}-join-reader
{{- end }}
