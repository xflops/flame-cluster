apiVersion: flame.xflops.io/v1alpha1
kind: FlameCluster
metadata:
  name: {{ .Values.nameOverride }}
spec:
  version: {{ .Values.version | quote }}
  {{- with .Values.endpoint }}
  endpoint: {{ . | quote }}
  {{- end }}
  {{- with .Values.kubernetesEndpoint }}
  kubernetesEndpoint: {{ . | quote }}
  {{- end }}
  rolloutRevision: {{ .Values.rolloutRevision | quote }}
  image: {{ .Values.image | quote }}
  nodePort: {{ .Values.nodePort }}
  storageSize: {{ .Values.storageSize | quote }}
  {{- with .Values.storageClass }}
  storageClass: {{ . | quote }}
  {{- end }}
  {{- with .Values.existingClaim }}
  existingClaim: {{ . | quote }}
  {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  nodeSelector:
    {{- toYaml .Values.nodeSelector | nindent 4 }}
  cacheEndpoints:
    {{- toYaml .Values.cacheEndpoints | nindent 4 }}
  gateway:
    {{- $gateway := deepCopy .Values.gateway }}
    {{- $_ := set $gateway "hostname" (required "gateway.hostname is required" .Values.gateway.hostname) }}
    {{- toYaml $gateway | nindent 4 }}
