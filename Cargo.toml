[workspace]
members = ["flame-api", "flame-operator", "flame-cluster", "flmlet"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
flame-api = { path = "flame-api" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
k8s-openapi = { version = "0.29", features = ["latest", "schemars"] }
kube = { version = "5.1", features = ["runtime", "derive", "rustls-tls"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
