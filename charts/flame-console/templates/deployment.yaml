{{- $tls := .Values.flame.tls -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flame-console.fullname" . }}
  labels:
    {{- include "flame-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "flame-console.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flame-console
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - {name: CONSOLE_BIND, value: "0.0.0.0:3000"}
            - name: CONSOLE_ALLOWED_HOSTS
              value: {{ join "," (required "security.allowedHosts must contain trusted API/UI hostnames" .Values.security.allowedHosts) | quote }}
            - name: FLAME_ENDPOINT
              value: {{ required "flame.endpoint must be the direct FLM endpoint" .Values.flame.endpoint | quote }}
            - name: FLAME_NAME
              value: {{ .Values.flame.name | quote }}
            {{- with .Values.flame.tls.domain }}
            - {name: FLAME_TLS_DOMAIN, value: {{ . | quote }}}
            {{- end }}
            {{- if or $tls.caConfigMap $tls.secretName }}
            {{- if or $tls.caConfigMap $tls.caKey }}
            - {name: FLAME_CA_FILE, value: "/etc/flame/tls/ca.crt"}
            {{- end }}
            {{- if and $tls.secretName (or $tls.certKey $tls.keyKey) }}
            - {name: FLAME_CERT_FILE, value: "/etc/flame/tls/tls.crt"}
            - {name: FLAME_KEY_FILE, value: "/etc/flame/tls/tls.key"}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            {{- if or $tls.caConfigMap $tls.secretName }}
            - {name: flame-tls, mountPath: /etc/flame/tls, readOnly: true}
            {{- end }}
      volumes:
        - name: temporary
          emptyDir: {}
        {{- if or $tls.caConfigMap $tls.secretName }}
        - name: flame-tls
          projected:
            sources:
              {{- if $tls.caConfigMap }}
              - configMap:
                  name: {{ $tls.caConfigMap | quote }}
                  items:
                    - {key: {{ required "flame.tls.caKey is required with caConfigMap" $tls.caKey | quote }}, path: ca.crt}
              {{- end }}
              {{- if and $tls.secretName (or (and (not $tls.caConfigMap) $tls.caKey) $tls.certKey $tls.keyKey) }}
              - secret:
                  name: {{ $tls.secretName | quote }}
                  items:
                    {{- if and (not $tls.caConfigMap) $tls.caKey }}
                    - {key: {{ $tls.caKey | quote }}, path: ca.crt}
                    {{- end }}
                    {{- if or $tls.certKey $tls.keyKey }}
                    - {key: {{ required "flame.tls.certKey is required with keyKey" $tls.certKey | quote }}, path: tls.crt}
                    - {key: {{ required "flame.tls.keyKey is required with certKey" $tls.keyKey | quote }}, path: tls.key}
                    {{- end }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
